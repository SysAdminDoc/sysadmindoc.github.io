# Portfolio (sysadmindoc) — static site on the Contabo VPS, behind the shared
# edge Caddy on the `web` network. Lives at
# /home/deploy/sites/portfolio/docker-compose.yml; built site at ./dist, the
# internal file-server config at ./Caddyfile. Deploy with `npm run deploy:vps`.
services:
  portfolio-app:
    # Pinned to an exact patch, not the floating 2.11-alpine tag. The deploy
    # recreates the container but a recreate reuses whatever image was last
    # pulled, so a floating tag reported "2.11" while silently staying on an old
    # patch. deploy-vps.mjs now pulls and then asserts the running `caddy
    # version` matches this pin, so a drifted image fails the deploy.
    #
    # 2.11.4 (2026-06-03) is current. The 2.11 line carries the 2026 fixes the
    # old 2.8-alpine tag never got: path-matcher bypass CVE-2026-27585, mTLS
    # fail-open CVE-2026-27586, Host-matcher bypass CVE-2026-27588, admin
    # cross-origin CVE-2026-27589, FastCGI CVE-2026-27590, plus the 2.11.3
    # admin-auth and 2.11.4 placeholder re-expansion fixes.
    #
    # PORTFOLIO_CADDY_VERSION in scripts/deploy-vps.mjs must be bumped with this.
    image: caddy:2.11.4-alpine
    container_name: portfolio-app
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    environment:
      CSP_POLICY: ${CSP_POLICY:?csp.env with the built CSP_POLICY is required}
    volumes:
      - ./dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Generated by the deploy from dist/projects.json; the Caddyfile imports it.
      - ./project-redirects.caddy:/etc/caddy/project-redirects.caddy:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The only container on more than one network: the edge reaches it on
    # `web`, it reaches the contact handler and ntfy on the private network,
    # and the report sink on a network of its own.
    networks:
      - web
      - portfolio-private
      - portfolio-reports

  csp-reporter:
    # The reporter has no third-party runtime dependency and is not published
    # on a host port. Its network holds only portfolio-app, which routes
    # /csp-report to it, so the containers on `web` can't reach it directly,
    # and it can't reach ntfy or the contact handler, which both take a
    # visitor's address from X-Forwarded-For. Anyone can still send it reports
    # through that route, which is what a report endpoint is for, so what it
    # stores is untrusted input.
    image: node:24-alpine
    container_name: portfolio-csp-reporter
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 64m
    cpus: "0.10"
    pids_limit: 32
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["node", "/app/csp-report-server.mjs"]
    environment:
      CSP_REPORT_LOG: /var/lib/csp-reports/reports.ndjson
      # The start of each of the site's own inline blocks, which deploy-vps.mjs
      # reads from the build; the sink stores any other sample as a marker.
      CSP_OWN_SAMPLES: ${CSP_OWN_SAMPLES:?csp.env with the site's own CSP samples is required}
    volumes:
      - ./csp-report-server.mjs:/app/csp-report-server.mjs:ro
      - ./csp-reports:/var/lib/csp-reports
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - portfolio-reports

  ntfy:
    # Lead notifications. 2.28.0 is past the critical parseActions RCE
    # (GHSA-pqhx-w72w-m393, fixed in 2.22.0) that the old 2.11.0 pin sat inside.
    # PORTFOLIO_NTFY_VERSION in scripts/deploy-vps.mjs must be bumped with this.
    image: binwiederhier/ntfy:v2.28.0
    container_name: portfolio-ntfy
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 64m
    cpus: "0.10"
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    command: ["serve"]
    environment:
      # Reached publicly only as https://notify.getparkerai.com, through the edge
      # and then portfolio-app. Nothing is readable or writable without a token.
      NTFY_BASE_URL: https://notify.getparkerai.com
      NTFY_LISTEN_HTTP: ":80"
      # ntfy rate-limits, and locks out failed logins, per visitor IP, taken as
      # the right-most X-Forwarded-For address it doesn't trust. portfolio-app
      # keeps the header only when the edge sent it, and appends the edge's
      # pinned address, so stripping that one address leaves the visitor's own.
      # Without this every visitor shared the edge's IP, and 30 bad tokens from
      # anyone locked the owner's phone out too. Stripping every private range
      # instead let any container on `web` choose the address ntfy saw.
      NTFY_BEHIND_PROXY: "true"
      NTFY_PROXY_TRUSTED_HOSTS: "172.18.255.254/32"
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      NTFY_WEB_ROOT: disable
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_ENABLE_LOGIN: "false"
    # NTFY_AUTH_USERS / NTFY_AUTH_ACCESS / NTFY_AUTH_TOKENS: bcrypt hashes and
    # tokens, generated on the server by deploy/vps/provision-notify-secrets.sh.
    # Never committed; compose refuses to start without the file.
    env_file:
      - path: ./ntfy-auth.env
        required: true
    volumes:
      - ./ntfy-cache:/var/cache/ntfy
      - ./ntfy-data:/var/lib/ntfy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - portfolio-private

  contact-handler:
    image: node:24-alpine
    container_name: portfolio-contact-handler
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 64m
    cpus: "0.10"
    pids_limit: 32
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["node", "/app/contact-handler.mjs"]
    environment:
      NTFY_URL: http://ntfy:80/portfolio-leads
      # Full submissions, fsync'd before the visitor gets an answer. The older
      # submissions.ndjson beside it (name, email, length only) follows the same
      # retention and is removed once empty.
      CONTACT_STORE: /var/lib/contact/leads.ndjson
    # NTFY_TOKEN (write-only) and CONTACT_SMOKE_SECRET, from
    # deploy/vps/provision-notify-secrets.sh. Never committed.
    env_file:
      - path: ./contact-secrets.env
        required: true
    volumes:
      - ./contact-handler.mjs:/app/contact-handler.mjs:ro
      - ./contact-data:/var/lib/contact
    depends_on:
      ntfy:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - portfolio-private

networks:
  web:
    external: true
  # Only portfolio-app, the contact handler and ntfy. None of the other
  # containers on the shared `web` network can reach the lead path, and the
  # network has no route out.
  portfolio-private:
    internal: true
  # Only portfolio-app and the report sink, with no route out.
  portfolio-reports:
    internal: true
