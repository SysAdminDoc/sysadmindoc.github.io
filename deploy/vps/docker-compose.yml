# Portfolio (sysadmindoc) — static site on the Contabo VPS, behind the shared
# edge Caddy on the `web` network. Lives at
# /home/deploy/sites/portfolio/docker-compose.yml; built site at ./dist, the
# internal file-server config at ./Caddyfile. Deploy with `npm run deploy:vps`.
services:
  portfolio-app:
    # Pinned to the 2.11 line (2.11.4 as of 2026-08-20). The old 2.8-alpine tag
    # stopped receiving image rebuilds, so its Alpine base went unpatched, and
    # 2.9-2.11 carry the 2026 Caddy fixes (path-matcher bypass CVE-2026-27585,
    # mTLS fail-open CVE-2026-27586, header-injection escalation in 2.11.2).
    image: caddy:2.11-alpine
    container_name: portfolio-app
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    environment:
      CSP_POLICY: ${CSP_POLICY:?csp.env with the built CSP_POLICY is required}
    volumes:
      - ./dist:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - web

  csp-reporter:
    # The reporter has no third-party runtime dependency and is not published
    # on a host port. It is reachable only from portfolio-app on the web net.
    image: node:24-alpine
    container_name: portfolio-csp-reporter
    restart: unless-stopped
    stop_grace_period: 10s
    mem_limit: 64m
    cpus: "0.10"
    pids_limit: 32
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["node", "/app/csp-report-server.mjs"]
    environment:
      CSP_REPORT_LOG: /var/lib/csp-reports/reports.ndjson
    volumes:
      - ./csp-report-server.mjs:/app/csp-report-server.mjs:ro
      - ./csp-reports:/var/lib/csp-reports
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - web

networks:
  web:
    external: true
